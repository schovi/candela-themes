# Deliver one already-released version to the downstream channels.
#
# Always dispatched by hand, after release.yml has cut the tag:
#
#   gh workflow run publish.yml -f ref=v0.2.4                 # every channel
#   gh workflow run publish.yml -f ref=v0.2.4 -f jetbrains=true \
#     -f dist_repos=false -f vscode=false -f openvsx=false    # retry one
#
# `ref` names the tag to build and publish; the run itself always dispatches
# from the default branch. That is deliberate: `--ref vX.Y.Z` resolves the
# *workflow file* at that tag, so any tag cut before a change to this file
# would run a stale version of it (or, if the file was renamed, fail with
# "workflow does not have workflow_dispatch trigger"). Passing the tag as an
# input keeps the workflow definition and the artifact version independent.
#
# Channels are split across jobs by how reversible they are, not by tool:
#
#   dist-repos        git pushes to our own Zed/Sublime distribution repos.
#                     Reversible, no third-party account — no environment, no
#                     approval, runs immediately.
#   vscode / openvsx  publishes to third-party registries. A version number, once
#   / jetbrains       taken, can never be reused or unpublished. Each runs in the
#                     protected `marketplace` environment, so its credentials are
#                     unreachable from ordinary PR/branch CI and a maintainer must
#                     approve every run.
#
# Every channel defaults to `true`. A channel whose credential secret is missing
# logs a warning and skips rather than failing the run, so a not-yet-registered
# store never turns a good release red.
#
# Still manual after this: the per-release PR to zed-industries/extensions bumping
# the submodule + version. Sublime Package Control picks the dist-repo tag up on
# its own. See docs/release-runbook.md.
name: Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build and publish (e.g. v0.2.4; blank = this run's ref)
        type: string
        default: ''
      dist_repos:
        description: Sync the Zed + Sublime distribution repos
        type: boolean
        default: true
      vscode:
        description: Publish to VS Code Marketplace
        type: boolean
        default: true
      openvsx:
        description: Publish to Open VSX
        type: boolean
        default: true
      jetbrains:
        description: Publish to JetBrains Marketplace (plugin must already be approved)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Reversible: pushes generated Zed/Sublime layouts into our own dist repos and
  # tags them. No marketplace environment — nothing here is irreversible, and
  # gating it behind approval would only delay the channels that need no review.
  dist-repos:
    if: ${{ inputs.dist_repos }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      # The generator has zero runtime dependencies, so no npm ci here.
      - run: npm run build
      - name: Sync Zed + Sublime extension repos
        env:
          DIST_PUSH_TOKEN: ${{ secrets.DIST_PUSH_TOKEN }}
        run: |
          if [ -z "$DIST_PUSH_TOKEN" ]; then
            echo "::warning::DIST_PUSH_TOKEN not set — skipping Zed/Sublime dist-repo sync."
            exit 0
          fi
          node scripts/publish-extension-repos.js

  vscode:
    if: ${{ inputs.vscode }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm run package:vscode
      - name: vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT not set — skipping VS Code Marketplace publish."
            exit 0
          fi
          node_modules/.bin/vsce publish --packagePath "$(ls dist/candela-themes-*.vsix)"

  openvsx:
    if: ${{ inputs.openvsx }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm run package:vscode
      - name: ovsx publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT not set — skipping Open VSX publish."
            exit 0
          fi
          node_modules/.bin/ovsx publish "$(ls dist/candela-themes-*.vsix)" -p "$OVSX_PAT"

  jetbrains:
    if: ${{ inputs.jetbrains }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.0.0'
      - run: npm ci
      - run: npm run package:intellij
      # Identifies the plugin by xmlId, not by the numeric marketplace id. The API
      # accepts either, and xmlId is generated from this repo's own plugin.xml, so it
      # cannot drift the way a hand-copied number can — a wrong number is a bare 404
      # with no hint that the id, not the token or the endpoint, was the problem.
      - name: Upload update to JetBrains Marketplace
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_TOKEN" ]; then
            echo "::warning::JETBRAINS_TOKEN not set — skipping JetBrains publish."
            exit 0
          fi
          XML_ID=$(sed -n 's:.*<id>\(.*\)</id>.*:\1:p' \
            build/intellij/src/main/resources/META-INF/plugin.xml | head -1)
          test -n "$XML_ID"
          echo "Uploading as xmlId=$XML_ID"
          curl -i --fail \
            -H "Authorization: Bearer $JETBRAINS_TOKEN" \
            -F xmlId="$XML_ID" \
            -F file=@"$(ls dist/candela-themes-intellij-*.zip)" \
            https://plugins.jetbrains.com/api/updates/upload
