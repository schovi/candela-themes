# Cut a release entirely in CI. Dispatch this (GitHub UI or
# `gh workflow run release.yml -f bump=minor`) and CI validates, creates an
# unpushed version commit and tag, builds every package at that version, then
# pushes and publishes the GitHub Release. A failed build leaves no remote
# commit or tag. Main-only.
#
# Delivery to every downstream channel (Zed/Sublime dist repos, VS Code, Open
# VSX, JetBrains) then runs automatically as the `publish` job, which calls
# publish.yml — so shipping a change reaches every channel by default instead of
# depending on someone remembering a second dispatch. The irreversible
# third-party publishes inside that workflow still sit behind the protected
# `marketplace` environment, so this job never touches store credentials and a
# maintainer approves each store push. Pass `publish=false` to cut a tag without
# delivering it.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for this release
        type: choice
        options: [patch, minor, major]
        default: patch
      publish:
        description: Deliver to dist repos + marketplaces after the GitHub Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Release only from main
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Release must run on main (got '$GITHUB_REF_NAME')." >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # IntelliJ plugin build needs a JDK and Gradle on PATH.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.0.0'

      - name: Install locked dependencies
        run: npm ci

      - name: Source JSON is valid
        run: python3 -m json.tool themes/candela-themes.json > /dev/null

      - name: Design invariants hold
        run: node scripts/validate.js

      - name: Explorer builds
        run: |
          cd app
          npm ci
          npm run build

      # Bump first so generated manifests + artifact filenames carry the new
      # version. Creates the commit + tag locally; nothing is pushed yet.
      - name: Bump version and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "release: v%s [skip ci]"
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The build is the gate: if any package fails, the job stops here and the
      # tag never reaches the remote.
      - name: Build every package
        run: npm run package

      - name: All-formats archive + checksums
        run: npm run package:release

      - name: Push commit and tag
        run: git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --verify-tag \
            --generate-notes \
            --title "Candela Themes v${VERSION}" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*.vsix \
            dist/*.sublime-package \
            dist/SHA256SUMS.txt

  # Deliver the tag everywhere. Called (not dispatched) because a workflow_dispatch
  # fired with GITHUB_TOKEN does not start a new run — workflow_call is the only
  # chain that avoids introducing a PAT. Passes the tag explicitly: a called
  # workflow inherits the caller's ref (main), which is one commit behind the bump.
  publish:
    needs: release
    if: ${{ inputs.publish }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: v${{ needs.release.outputs.version }}
      dist_repos: true
      vscode: true
      openvsx: true
      jetbrains: true
    secrets: inherit
